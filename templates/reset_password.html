<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Set Password - TaskMonster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            padding-top: max(1rem, calc(env(safe-area-inset-top) + 0.5rem)) !important;
        }
        @media (min-width: 768px) {
            body {
                padding-top: max(2.5rem, env(safe-area-inset-top)) !important;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-10 font-sans">
    <div class="max-w-sm mx-auto">
        <div class="bg-slate-800 border border-slate-700/80 rounded-3xl p-6 md:p-8 shadow-2xl">
            <h1 class="text-2xl font-extrabold text-white tracking-tight flex items-center gap-2 mb-1">
                🔑 Set a New Password
            </h1>
            <p class="text-slate-400 text-sm mb-6 leading-relaxed">
                Choose a new password - at least 8 characters.
            </p>

            {% if error == 'mismatch' %}
            <p class="text-rose-400 text-xs mb-4">Those two passwords didn't match - try again.</p>
            {% elif error == 'short' %}
            <p class="text-rose-400 text-xs mb-4">Password must be at least 8 characters.</p>
            {% endif %}

            <form action="/reset-password/{{ token }}" method="POST" class="space-y-3">
                <input type="password" name="password" placeholder="New password" required minlength="8" autocomplete="new-password"
                       class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                <input type="password" name="confirm_password" placeholder="Confirm new password" required minlength="8" autocomplete="new-password"
                       class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                <button type="submit"
                        class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/20 transition-all">
                    Set Password &amp; Sign In
                </button>
            </form>
        </div>
    </div>
</body>
</html>
