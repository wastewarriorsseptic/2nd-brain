<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>New Contact - TaskMonster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Same notch/Dynamic Island clearance as Profile/Privacy/forgot-password - reported
           directly as sitting "too high", flush against the status bar/notch on a real device.
           env() is 0 in a normal browser tab, so this falls back to the original p-3 padding
           there with no visible change. */
        body {
            padding-top: max(0.75rem, calc(env(safe-area-inset-top) + 0.5rem)) !important;
        }
        @media (min-width: 768px) {
            body {
                padding-top: max(2.5rem, env(safe-area-inset-top)) !important;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 md:p-10 font-sans">
    <div class="max-w-xl mx-auto">
        <div class="bg-slate-800 border border-slate-700/80 rounded-3xl p-5 md:p-8 shadow-2xl relative">
            <a href="{{ back_url or '/' }}" aria-label="Close" class="absolute top-3 right-3 w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white transition-colors bg-slate-900/80 rounded-full border border-slate-700/60 z-10">
                ✕
            </a>
            <h1 class="text-xl font-extrabold text-white tracking-tight flex items-center gap-2 mb-0.5 pr-10">
                👤 New Contact
            </h1>
            <p class="text-slate-500 text-xs mb-4">Add someone to your contacts.</p>

            <form action="/people/" method="POST" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">Name</label>
                    <input type="text" name="name" required placeholder="e.g. Jane Smith" autofocus
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">Phone (optional)</label>
                        <input type="tel" name="phone" placeholder="(555) 123-4567"
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">Email (optional)</label>
                        <input type="email" name="email" placeholder="jane@example.com"
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">Company (optional)</label>
                    <input type="text" name="company" placeholder="e.g. Acme Inc."
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">Note (optional)</label>
                    <textarea name="notes" rows="2" placeholder="Anything worth remembering"
                              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                </div>

                <!-- No Realm/Bucket picker - Universe + Tags only everywhere now, same as tasks
                     (see the tag backfill from Realm names). This person lands in the auto-
                     created default Contacts bucket (get_or_create_default_contact_bucket,
                     called before this page even renders) via the hidden bucket_id below;
                     "Organize" is just an optional free-text Tag, collapsed by default exactly
                     like a task's own optional Tag field. -->
                <input type="hidden" name="bucket_id" value="{{ default_bucket_id }}">
                <div>
                    <button type="button" onclick="togglePersonOrganize()" id="person-organize-toggle"
                            class="text-xs font-semibold text-indigo-400 hover:text-indigo-300 transition-colors">
                        📁 Organize this (optional) ›
                    </button>
                    <div id="person-organize-body" class="hidden mt-2">
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">Tag (optional)</label>
                        <input type="text" name="tags" placeholder="e.g. Family, Customer, College"
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <button type="submit"
                        class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition-all">
                    Save Contact
                </button>
            </form>
        </div>
    </div>

    <script>
        function togglePersonOrganize() {
            const body = document.getElementById('person-organize-body');
            const toggle = document.getElementById('person-organize-toggle');
            const isHidden = body.classList.toggle('hidden');
            toggle.textContent = isHidden ? '📁 Organize this (optional) ›' : '📁 Organize this (optional) ⌄';
        }
    </script>
</body>
</html>
