<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Event - TaskMonster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Google Places' own autocomplete dropdown ships with light-mode styling that doesn't
           follow this page's dark theme - overridden here rather than left illegible. */
        .pac-container { background: #1e293b; border: 1px solid #475569; border-radius: 0.75rem; margin-top: 4px; font-family: inherit; }
        .pac-item { color: #cbd5e1; border-color: #334155; padding: 8px 12px; font-size: 13px; }
        .pac-item:hover, .pac-item-selected { background: #334155; }
        .pac-item-query { color: #f1f5f9; }
        .pac-matched { color: #818cf8; }
        .pac-icon { filter: invert(1) brightness(1.6); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-10 font-sans">
    <div class="max-w-xl mx-auto">
        <a href="/" class="text-xs font-semibold text-indigo-400 hover:text-indigo-300 transition-colors mb-4 inline-block">← Back to TaskMonster</a>

        <div class="bg-slate-800 border border-slate-700/80 rounded-3xl p-6 md:p-8 shadow-2xl">
            <h1 class="text-2xl font-extrabold text-white tracking-tight flex items-center gap-2 mb-1">
                🎉 New Event
            </h1>
            <p class="text-slate-400 text-sm mb-6">Send a cool, shareable invite for a specific day - with or without RSVPs.</p>

            <form action="/events/" method="POST" class="space-y-5" id="event-create-form">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-1.5">Title</label>
                    <input type="text" name="title" required placeholder="e.g. Sarah's Birthday Dinner"
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-1.5">Date</label>
                        <input type="date" name="due_date" required
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-1.5">Time</label>
                        <select name="due_time" id="event-form-due-time-select"
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"></select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-1.5">Emoji</label>
                    <input type="text" name="emoji" value="🎉" maxlength="8"
                           class="w-16 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-lg text-center focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-1.5">Where (optional)</label>
                    <input type="text" name="location" id="event-location-input" autocomplete="off"
                           placeholder="{{ 'Start typing an address or place…' if google_places_enabled else 'Address, place name, or "Zoom" / "TBD"' }}"
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Collapsed by default - most events need no organizing decision at all, they
                     just land in the auto-created default Events bucket (see
                     get_or_create_default_event_bucket in app.py). The <select> stays in the DOM
                     either way so its value still submits when this is left collapsed - only the
                     wrapper's visibility toggles, nothing about the field itself. Expand this for
                     business-style organization (e.g. separate Realms per client type). -->
                <div>
                    <button type="button" onclick="toggleEventOrganize()" id="event-organize-toggle"
                            class="text-xs font-semibold text-indigo-400 hover:text-indigo-300 transition-colors">
                        📁 Organize this (optional) ›
                    </button>
                    <div id="event-organize-body" class="hidden mt-2">
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-1.5">Save into</label>
                        <!-- Grouped by Universe (optgroup) since this now spans every Task-bearing
                             Universe, not just dedicated Event ones - e.g. picking a bucket inside
                             an existing "Life Events" Universe so the event shows up right there,
                             not siloed off in a separate Events-only picker. -->
                        <select name="bucket_id" required
                                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                            {% for universe_id, realm_group in realms|groupby('universe_id') %}
                                {% set universe = universe_by_id.get(universe_id) %}
                                <optgroup label="{{ universe.icon if universe else '' }} {{ universe.name if universe else 'Universe' }}">
                                    {% for realm in realm_group %}
                                        {% for bucket in buckets_by_realm.get(realm.id, []) %}
                                            <option value="{{ bucket.id }}" {{ 'selected' if bucket.id == default_bucket_id else '' }}>{{ realm.icon }} {{ realm.name }} / {{ bucket.name }}</option>
                                        {% endfor %}
                                    {% endfor %}
                                </optgroup>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-1.5">Note (optional)</label>
                    <textarea name="description" rows="2" placeholder="Anything guests should know"
                              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                </div>

                <div class="border-t border-slate-700/80 pt-5 space-y-4">
                    <label class="flex items-center gap-2.5 cursor-pointer">
                        <input type="checkbox" name="requires_rsvp" value="true" checked
                               class="w-4 h-4 rounded border-slate-600 bg-slate-900 text-indigo-500 focus:ring-indigo-500">
                        <span class="text-sm text-slate-200">Ask guests to RSVP <span class="text-slate-500">(turn off for a plain confirmation, e.g. an appointment)</span></span>
                    </label>

                    <label class="flex items-center gap-2.5 cursor-pointer">
                        <input type="checkbox" name="is_private" value="true" id="event-is-private"
                               class="w-4 h-4 rounded border-slate-600 bg-slate-900 text-indigo-500 focus:ring-indigo-500">
                        <span class="text-sm text-slate-200">🔒 Private - only the people I invite can open it <span class="text-slate-500">(the link itself won't work for anyone else, and can't be shared onward)</span></span>
                    </label>

                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-1.5">Invite people (emails, one per line or comma-separated)</label>
                        <textarea name="guest_emails" rows="3" placeholder="friend@example.com, another@example.com"
                                  class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                        <p class="text-[11px] text-slate-500 mt-1" id="event-guest-emails-hint">You'll also get a shareable link on the next page, so this is optional.</p>
                    </div>
                </div>

                <div class="border-t border-slate-700/80 pt-5 space-y-4">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wide">Reminders</p>
                    <label class="flex items-center gap-2.5 cursor-pointer">
                        <input type="checkbox" name="remind_day_before" value="true" checked
                               class="w-4 h-4 rounded border-slate-600 bg-slate-900 text-indigo-500 focus:ring-indigo-500">
                        <span class="text-sm text-slate-200">Remind the day before</span>
                    </label>
                    <div class="flex items-center gap-2.5">
                        <span class="text-sm text-slate-200">Remind</span>
                        <input type="number" name="reminder_minutes_before" value="60" min="0" step="5"
                               class="w-24 bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                        <span class="text-sm text-slate-200">minutes before (0 = right at the moment)</span>
                    </div>
                </div>

                <button type="submit"
                        class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition-all">
                    Create & Get Invite Link
                </button>
            </form>
        </div>
    </div>

    <script>
        // Native <input type="time"> steppers don't reliably honor the `step` attribute in every
        // browser's own picker UI (Chrome's desktop dropdown in particular still lists every
        // single minute regardless) - reported directly. A plain <select> built from a fixed
        // 15-minute grid guarantees it everywhere instead of just hoping the browser respects a
        // hint. currentValue, if it doesn't land on the grid, is injected as its own extra option
        // rather than silently dropped - not a concern for a brand-new event, but this same
        // function is shared with the edit-task form where a pre-existing due time might not be.
        function populateTimeSelect(select, currentValue) {
            if (!select) return;
            let html = '<option value="">Time (optional)</option>';
            let matched = false;
            for (let totalMinutes = 0; totalMinutes < 24 * 60; totalMinutes += 15) {
                const h24 = Math.floor(totalMinutes / 60);
                const m = totalMinutes % 60;
                const value = `${String(h24).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                if (currentValue && value === currentValue) matched = true;
                const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
                const ampm = h24 < 12 ? 'AM' : 'PM';
                html += `<option value="${value}">${h12}:${String(m).padStart(2, '0')} ${ampm}</option>`;
            }
            if (currentValue && !matched) {
                const [hh, mm] = currentValue.split(':').map(Number);
                const h12 = hh % 12 === 0 ? 12 : hh % 12;
                const ampm = hh < 12 ? 'AM' : 'PM';
                html += `<option value="${currentValue}">${h12}:${String(mm).padStart(2, '0')} ${ampm}</option>`;
            }
            select.innerHTML = html;
            if (currentValue) select.value = currentValue;
        }
        populateTimeSelect(document.getElementById('event-form-due-time-select'));

        function toggleEventOrganize() {
            const body = document.getElementById('event-organize-body');
            const toggle = document.getElementById('event-organize-toggle');
            const isHidden = body.classList.toggle('hidden');
            toggle.textContent = isHidden ? '📁 Organize this (optional) ›' : '📁 Organize this (optional) ⌄';
        }

        // A private event (see the 🔒 checkbox above) is only ever viewable via a specific
        // guest's own personal link - with no guest emails at all, nobody but the creator could
        // ever open it. Not a hard client-side block (the server doesn't require it either -
        // someone might genuinely want to add guests later), just steering away from that trap:
        // the hint text calls it out, and submitting empty prompts a confirm() rather than
        // silently creating an invite nobody can see.
        const isPrivateCheckbox = document.getElementById('event-is-private');
        const guestEmailsHint = document.getElementById('event-guest-emails-hint');
        const defaultGuestEmailsHint = guestEmailsHint ? guestEmailsHint.textContent : '';
        if (isPrivateCheckbox && guestEmailsHint) {
            isPrivateCheckbox.addEventListener('change', () => {
                guestEmailsHint.textContent = isPrivateCheckbox.checked
                    ? "Private invites need at least one email - that's the only way in, since the link itself won't work for anyone else."
                    : defaultGuestEmailsHint;
            });
        }
        const eventCreateForm = document.getElementById('event-create-form');
        if (eventCreateForm) {
            eventCreateForm.addEventListener('submit', (e) => {
                const guestEmailsField = eventCreateForm.querySelector('[name="guest_emails"]');
                const isPrivate = isPrivateCheckbox && isPrivateCheckbox.checked;
                const hasGuests = guestEmailsField && guestEmailsField.value.trim().length > 0;
                if (isPrivate && !hasGuests) {
                    if (!confirm("This is set to Private with no one invited yet - nobody (not even you, on the invite link itself) will be able to open it until you add at least one guest email. Create it anyway?")) {
                        e.preventDefault();
                    }
                }
            });
        }

        {% if google_places_enabled %}
        // Progressive enhancement only - the "Where" input above is a plain, fully working text
        // field with no autocomplete of its own; this just helps fill it in with a clean address
        // when a Google Maps API key is configured (see GOOGLE_PLACES_ENABLED in app.py).
        function initGooglePlacesAutocomplete() {
            const input = document.getElementById('event-location-input');
            if (!input || !window.google || !window.google.maps || !window.google.maps.places) return;
            new google.maps.places.Autocomplete(input, { fields: ['formatted_address', 'name'] });
        }
        {% endif %}
    </script>
    {% if google_places_enabled %}
    <script src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}&libraries=places&callback=initGooglePlacesAutocomplete" async defer></script>
    {% endif %}
</body>
</html>
