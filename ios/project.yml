name: TaskMonster
options:
  bundleIdPrefix: com.usetaskmonster
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Release: release
targets:
  TaskMonster:
    type: application
    platform: iOS
    sources:
      - TaskMonster/Sources
      - TaskMonster/Assets.xcassets
    info:
      path: TaskMonster/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "TaskMonster uses your mic for voice dictation when adding tasks through the AI assistant."
        # A distinct permission from NSMicrophoneUsageDescription above - iOS gates the actual
        # speech-to-text transcription behind its own Speech Recognition authorization, separate
        # from raw microphone access. Without this key, WKWebView's webkitSpeechRecognition
        # object still exists and .start() doesn't throw, but iOS silently denies the underlying
        # recognition session - the mic button's own "listening" UI state still activates (that's
        # purely JS/CSS, no permission needed for that part), but no audio is ever transcribed.
        # Reported directly: "the microphone circle... isn't actually working and listening".
        NSSpeechRecognitionUsageDescription: "TaskMonster uses on-device speech recognition to turn your voice into task text when you tap the mic in AI chat."
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usetaskmonster.ios
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "11"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: XD34CA7MJU
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # Automatic signing's provisioning resolver insists on generating a
          # Development profile first (which needs a registered device) even
          # for an Archive/Release build that only ever needs Distribution
          # signing - a real Xcode quirk, reproduced identically via the CLI,
          # the GUI, and API-key auth, regardless of a connected/trusted
          # device. Manual signing for Release only sidesteps that resolver
          # entirely, pointing straight at the Distribution certificate and
          # an App Store profile created directly via the App Store Connect
          # API (which never needs any device). Debug stays Automatic since
          # local development/testing is unaffected by any of this.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "TaskMonster App Store CLI"
